<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page moved | Soheil Aghayani</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/brand/favicon.svg">
    <style>
        :root { color-scheme: dark; }
        body { background: #07131a; color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
        main { border: 1px solid #1e4650; border-radius: 1.25rem; max-width: 42rem; padding: 2.5rem; background: linear-gradient(145deg, #0d2830, #0a1721); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .28); }
        h1 { align-items: center; display: flex; gap: .75rem; margin-top: 0; }
        .page-icon { color: #5eead4; height: 2rem; width: 2rem; }
        a { color: #7dd3fc; }
        a:focus-visible { outline: 2px solid #5eead4; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <h1><svg class="page-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/sprite.svg?v=3.0-icon-md#states-go-back"></use></svg>This page moved</h1>
        <p>The portfolio now lives at <a id="portfolioLink" href="/">soheil-aghayani.github.io</a>.</p>
    </main>
    <script>
        (() => {
            const legacyPrefix = /^\/Portfolio(?:\/|$)/i;
            if (!legacyPrefix.test(window.location.pathname)) return;

            const nextPath = window.location.pathname.replace(legacyPrefix, '/') || '/';
            const target = `${nextPath}${window.location.search}${window.location.hash}`;
            document.getElementById('portfolioLink').href = target;
            window.location.replace(target);
        })();
    </script>
</body>
</html>
