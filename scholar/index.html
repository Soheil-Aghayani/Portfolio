<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="0;url=https://scholar.google.com/citations?user=bnprOf8AAAAJ&amp;hl=en">
    <link rel="canonical" href="https://scholar.google.com/citations?user=bnprOf8AAAAJ&amp;hl=en">
    <title>Soheil Aghayani · Google Scholar</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5f1e9;
        --muted: #b8c2c5;
        --accent: #f2b84b;
        --panel: rgba(13, 35, 42, 0.9);
        --line: rgba(242, 184, 75, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, rgba(30, 167, 161, 0.24), transparent 34%),
          radial-gradient(circle at 85% 80%, rgba(242, 184, 75, 0.16), transparent 30%),
          #081b22;
        color: var(--ink);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 5vw, 2.5rem);
        line-height: 1.15;
      }

      p { color: var(--muted); }

      a {
        display: inline-block;
        margin-top: 10px;
        padding: 10px 18px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
      }

      a:hover { background: rgba(242, 184, 75, 0.14); }

      .back {
        border: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Soheil Aghayani · Research</p>
      <h1>Opening Google Scholar…</h1>
      <p>If the redirect does not happen automatically, use the button below.</p>
      <a href="https://scholar.google.com/citations?user=bnprOf8AAAAJ&amp;hl=en">Continue to Google Scholar</a>
      <br>
      <a class="back" href="/">Return to portfolio</a>
    </main>
    <script>
      window.location.replace("https://scholar.google.com/citations?user=bnprOf8AAAAJ&hl=en");
    </script>
  </body>
</html>
