<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Grid -->
  <rect width="100" height="100" rx="15" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <g opacity="0.15">
    <line x1="20" y1="0" x2="20" y2="100" stroke="#fff" stroke-dasharray="2 2" />
    <line x1="40" y1="0" x2="40" y2="100" stroke="#fff" stroke-dasharray="2 2" />
    <line x1="60" y1="0" x2="60" y2="100" stroke="#fff" stroke-dasharray="2 2" />
    <line x1="80" y1="0" x2="80" y2="100" stroke="#fff" stroke-dasharray="2 2" />
    <line x1="0" y1="20" x2="100" y2="20" stroke="#fff" stroke-dasharray="2 2" />
    <line x1="0" y1="40" x2="100" y2="40" stroke="#fff" stroke-dasharray="2 2" />
    <line x1="0" y1="60" x2="100" y2="60" stroke="#fff" stroke-dasharray="2 2" />
    <line x1="0" y1="80" x2="100" y2="80" stroke="#fff" stroke-dasharray="2 2" />
  </g>
  <!-- Snake Body -->
  <rect x="25" y="45" width="10" height="10" rx="2" fill="url(#snakeGrad)" />
  <rect x="35" y="45" width="10" height="10" rx="2" fill="url(#snakeGrad)" />
  <rect x="45" y="45" width="10" height="10" rx="2" fill="url(#snakeGrad)" />
  <rect x="45" y="55" width="10" height="10" rx="2" fill="url(#snakeGrad)" />
  <rect x="45" y="65" width="10" height="10" rx="2" fill="url(#snakeGrad)" />
  <rect x="55" y="65" width="10" height="10" rx="3" fill="#38bdf8" filter="url(#glow)" /> <!-- Head -->
  <!-- Eyes on Head -->
  <circle cx="61" cy="68" r="1" fill="#0f172a" />
  <circle cx="61" cy="72" r="1" fill="#0f172a" />
  <!-- Food -->
  <circle cx="75" cy="35" r="5" fill="#ef4444" filter="url(#glow)" />
  <path d="M 75 30 Q 77 25 80 26" stroke="#4ade80" stroke-width="1.5" fill="none" />
</svg>
