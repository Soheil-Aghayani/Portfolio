<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="15" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <!-- T-Block (Purple) -->
  <g transform="translate(18, 15)">
    <rect x="16" y="0" width="14" height="14" rx="2" fill="#a78bfa" stroke="#c084fc" stroke-width="1" filter="url(#glow)" />
    <rect x="0" y="15" width="14" height="14" rx="2" fill="#a78bfa" stroke="#c084fc" stroke-width="1" filter="url(#glow)" />
    <rect x="15" y="15" width="14" height="14" rx="2" fill="#a78bfa" stroke="#c084fc" stroke-width="1" filter="url(#glow)" />
    <rect x="30" y="15" width="14" height="14" rx="2" fill="#a78bfa" stroke="#c084fc" stroke-width="1" filter="url(#glow)" />
  </g>
  <!-- L-Block (Orange) -->
  <g transform="translate(38, 48)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#fb923c" stroke="#fdba74" stroke-width="1" filter="url(#glow)" />
    <rect x="0" y="15" width="14" height="14" rx="2" fill="#fb923c" stroke="#fdba74" stroke-width="1" filter="url(#glow)" />
    <rect x="15" y="15" width="14" height="14" rx="2" fill="#fb923c" stroke="#fdba74" stroke-width="1" filter="url(#glow)" />
    <rect x="30" y="15" width="14" height="14" rx="2" fill="#fb923c" stroke="#fdba74" stroke-width="1" filter="url(#glow)" />
  </g>
  <!-- I-Block (Teal) -->
  <g transform="translate(15, 48)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#2dd4bf" stroke="#5eead4" stroke-width="1" filter="url(#glow)" />
    <rect x="0" y="15" width="14" height="14" rx="2" fill="#2dd4bf" stroke="#5eead4" stroke-width="1" filter="url(#glow)" />
  </g>
</svg>
