<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="15" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <g transform="translate(50, 52)">
    <!-- Spikes -->
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#ef4444" stroke-width="4" filter="url(#glow)" />
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#ef4444" stroke-width="4" filter="url(#glow)" />
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#ef4444" stroke-width="4" filter="url(#glow)" />
    <line x1="-22" y1="22" x2="22" y2="-22" stroke="#ef4444" stroke-width="4" filter="url(#glow)" />
    <!-- Mine Body -->
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <!-- Inner glowing red dot / light -->
    <circle cx="0" cy="0" r="6" fill="#ef4444" filter="url(#glow)" />
    <!-- Reflection highlight -->
    <circle cx="-7" cy="-7" r="3" fill="#fff" opacity="0.6" />
  </g>
  <!-- Fuse -->
  <path d="M 68 28 Q 78 20 80 30" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="80" cy="30" r="2" fill="#fb923c" filter="url(#glow)" />
</svg>
