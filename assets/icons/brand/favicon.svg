<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark background container with rounded edges -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <!-- Glowing subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#grad)" stroke-width="12" stroke-opacity="0.4" />
  <!-- Terminal / Code brackets with SA Monogram -->
  <g filter="url(#glow)">
    <!-- Terminal Left Bracket < -->
    <path d="M140 180 L80 256 L140 332" fill="none" stroke="url(#grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Terminal Right Bracket > -->
    <path d="M372 180 L432 256 L372 332" fill="none" stroke="url(#grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Stylized S & A Monogram in center -->
    <text x="256" y="295" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="160" fill="url(#grad)" text-anchor="middle" letter-spacing="-6">SA</text>
  </g>
</svg>
