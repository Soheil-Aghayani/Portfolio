<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="15" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <!-- Back Card -->
  <g transform="rotate(-10 50 50)">
    <rect x="25" y="20" width="36" height="52" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <path d="M 43 40 C 43 35, 53 35, 53 40 C 53 45, 43 47, 43 53 C 43 47, 33 45, 33 40 C 33 35, 43 35, 43 40 Z" fill="#ef4444" />
    <text x="29" y="32" font-family="'Outfit', sans-serif" font-size="7" font-weight="bold" fill="#ef4444">A</text>
  </g>
  <!-- Front Card -->
  <g transform="rotate(5 50 50)">
    <rect x="42" y="22" width="36" height="52" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Spade shape -->
    <path d="M 60 42 C 60 38, 68 38, 68 42 C 68 46, 60 52, 60 52 C 60 52, 52 46, 52 42 C 52 38, 60 38, 60 42 Z M 58 52 L 62 52 L 60 57 Z" fill="#38bdf8" />
    <text x="46" y="34" font-family="'Outfit', sans-serif" font-size="7" font-weight="bold" fill="#38bdf8">J</text>
  </g>
</svg>
